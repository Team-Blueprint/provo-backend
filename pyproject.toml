[project]
name = "proofwork-backend"
version = "0.1.0"
description = "Proofwork turns informal payments into verified income records for lenders."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.32.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "phonenumbers>=8.13.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyjwt>=2.15.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["B008", "BLE001"]

[tool.uv.workspace]
members = [
    "proofwork-backend",
]
